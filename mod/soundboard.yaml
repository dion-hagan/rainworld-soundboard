# =============================================================================
#  CUSTOM SOUNDBOARD  -  soundboard.yaml
# =============================================================================
#  This one file decides which sound plays when. Edit it with any text editor
#  (Notepad is fine), save it, then either restart Rain World or open
#  Options > Mods > Custom Soundboard and press RELOAD CONFIG.
#
#  WHERE THIS FILE LIVES
#    Your personal copy sits in the game's data folder, so mod updates never
#    overwrite your changes. Press OPEN FOLDER on the mod's options screen to
#    jump straight to it. Put your own sound files (.wav, .ogg or .mp3) in the
#    "sounds" folder next to this file. To start over with the defaults,
#    delete this file - a fresh copy appears the next time the game starts.
#
#  THE BASICS
#    Under "events:", write the name of something that can happen in the game,
#    then list what should play. Every event name you can use is listed in
#    events.txt, in the same folder as this file.
#
#      events:
#        PlayerDeath:
#          - boom.wav                  <- simplest form: just a file name
#
#    Add options underneath a file to tune it:
#
#          - file: boom.wav
#            volume: 0.5               <- 1 = as recorded, 0.5 = half, 2 = double
#            delay: 1.5                <- seconds to wait before it plays
#            name: "Big Boom"          <- label in the options menu (optional)
#            enabled: false            <- start switched off (optional)
#
#    Several entries under one event take turns: the first death plays the
#    first sound, the next death plays the second, and so on, around again.
#
#    To play several sounds AT THE SAME TIME as a single step of that rotation:
#
#          - together:
#              - boom.wav
#              - file: crash.wav
#                volume: 0.5
#
#  TIPS
#    * Indent with spaces, never tabs. Lines that line up belong together.
#    * Put quotes around text containing a colon or a #  ->  name: "Fire: hot"
#    * Write decimals with a dot: 0.5, not 0,5.
#    * If something is wrong, the options screen lists each problem with its
#      line number, and everything else keeps working.
# =============================================================================


# Numbers that tune some of the built-in events. Safe to leave alone.
settings:
  hard-landing-speed: 30            # impact speed that counts as a hard landing
  terminal-velocity: 40             # fall speed that triggers PlayerTerminalVelocity
  player-jump-cooldown: 2           # seconds between PlayerJumpCooldown sounds
  artificer-pyro-jump-cooldown: 10  # seconds between Artificer pyro-jump sounds
  spotted-cooldown: 10              # seconds before the same creature can "spot" you again
  debug: false                      # true = log every event to BepInEx/LogOutput.log


